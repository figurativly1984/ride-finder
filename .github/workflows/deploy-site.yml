name: Build timetable and publish site

on:
  push:
    branches: [main]
    paths-ignore: ["worker/**", "README.md"]
  schedule:
    - cron: "17 9 * * *" # every morning, ~5 am Atlanta time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build timetable from MARTA + Emory schedules
        run: node build/build.mjs
      - name: Show what was built
        run: cat site/data/meta.json && ls -la site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
