name: Build timetable and publish site

on:
  push:
    branches: [main]
    paths-ignore: ["worker/**", "README.md"]
  schedule:
    - cron: "17 9 * * *" # every morning, ~5 am Atlanta time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build timetable from MARTA + Emory schedules
        run: |
          set -o pipefail
          node build/build.mjs 2>&1 | tee build.log
      - name: Report what was built
        if: always()
        run: |
          while IFS= read -r line; do echo "::notice title=Timetable build::$line"; done < build.log
          [ -f site/data/meta.json ] && echo "::notice title=Timetable meta::$(cat site/data/meta.json)"
          [ -d site/data ] && echo "::notice title=Timetable files::$(ls -la site/data | awk 'NR>3{printf "%s %s; ", $9, $5}')"
      - name: Plan sample trips on the new timetable
        run: |
          node test/sample-trips.mjs site/data | tee trips.log
          while IFS= read -r line; do echo "::notice title=Sample trip::$line"; done < trips.log
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
